<style>
:root{
  color-scheme:light;
  --disp:"Fira Sans Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,system-ui,sans-serif;
  --navy:#0E1C6E; --blue:#0B3CB8; --blue-d:#082c8a; --yellow:#F8C315; --teal:#1EC2C0; --coral:#F57F6C;
  --sky:#E4F3FD; --sky2:#CFEAFB; --cream:#FFF8E8; --mint:#DDF6EC; --ink:#1B2245; --muted:#525B7E; --line:#E2E6F0;
  --bg:#FFFFFF; --soft:#F6F8FC; --ok:#13A07A; --err:#D8443A;
  --r:22px; --shadow:0 6px 24px rgba(14,28,110,.08),0 1px 3px rgba(14,28,110,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--disp);color:var(--navy);margin:0;line-height:1.15}
button,input,select,textarea{font:inherit}
a{color:var(--blue)}
img{max-width:100%;display:block}
.hidden{display:none!important}

/* хвиля праворуч угорі */
.wave{position:fixed;top:0;right:0;width:min(330px,40vw);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:1240px;margin:0 auto;padding-block:0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* шапка */
.top{display:flex;align-items:center;gap:18px;padding:18px 0 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;cursor:pointer;min-width:0}
.brand img{width:76px;height:auto}
.brand .sep{width:2px;align-self:stretch;background:var(--navy);opacity:.8;margin:6px 0}
.brand b{display:block;font-family:var(--disp);font-weight:800;color:var(--navy);font-size:clamp(22px,3.2vw,38px);line-height:1.05;letter-spacing:-.01em}
.brand small{display:block;color:var(--navy);font-size:clamp(13px,1.4vw,18px);font-weight:600;margin-top:4px}
.nav{margin-left:auto;display:flex;align-items:center;gap:6px}
.nav button{border:0;background:none;color:var(--navy);font-weight:800;font-family:var(--disp);font-size:16px;padding:10px 20px;border-radius:999px;cursor:pointer}
.nav button.on{background:var(--blue);color:#fff}
.nav button:hover:not(.on){background:var(--sky)}
.nav .ava,.ava{width:48px;height:48px;border-radius:50%;background:var(--sky2);display:grid;place-items:center;font-family:var(--disp);font-weight:800;color:var(--navy);font-size:20px;border:0;cursor:pointer;position:relative;padding:0!important}
.ava::after{content:"";position:absolute;right:-8px;top:-8px;width:14px;height:14px;background:radial-gradient(circle,var(--yellow) 30%,transparent 32%)}
.menu{position:absolute;right:0;top:56px;background:#fff;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:8px;min-width:210px;z-index:20}
.menu div{padding:8px 12px;color:var(--muted);font-size:14px}
.menu button{width:100%;text-align:left;border-radius:10px!important}

/* заголовки сторінок */
.crumbs{display:flex;align-items:center;gap:8px;color:var(--navy);font-size:16px;margin:6px 0 4px;flex-wrap:wrap}
.crumbs a{color:var(--navy);text-decoration:none;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.crumbs b{font-weight:800}
.ptitle{border-left:6px solid var(--yellow);padding-left:20px;margin:12px 0 26px}
.ptitle h1{font-size:clamp(28px,4.4vw,52px);font-weight:800;letter-spacing:-.01em}
.ptitle p{margin:6px 0 0;font-size:clamp(16px,1.8vw,21px);color:var(--ink)}
main{flex:1}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--blue);background:var(--blue);color:#fff;font-family:var(--disp);font-weight:800;font-size:17px;padding:12px 26px;border-radius:14px;cursor:pointer;text-decoration:none;transition:transform .12s,background .12s}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--navy)}
.btn.ghost:hover{background:var(--sky)}
.btn.pill{border-radius:14px;padding:10px 30px}
.btn.sm{font-size:14px;padding:8px 16px;border-radius:12px}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:22px;height:22px}

/* картки */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #EEF1F7;padding:26px}
.chead{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.chead .ic{width:56px;height:56px;border-radius:14px;background:var(--sky);display:grid;place-items:center;flex:none}
.chead .ic svg{width:30px;height:30px;color:var(--blue)}
.chead h2{font-size:clamp(22px,2.4vw,30px);font-weight:800}
.chead h2::after{content:"";display:block;width:84px;height:4px;background:var(--yellow);border-radius:3px;margin-top:8px}

/* вхід */
.login{display:grid;grid-template-columns:minmax(300px,600px) 1fr;gap:28px;align-items:stretch;margin:24px 0 30px}
.login .card{display:flex;flex-direction:column;justify-content:center;padding:44px 40px}
.lock{display:flex;align-items:center;gap:24px;margin-bottom:34px}
.lock .ic{width:94px;height:94px;border-radius:22px;background:var(--sky);display:grid;place-items:center;flex:none}
.lock .ic svg{width:52px;height:52px;color:var(--blue)}
.lock h2{font-size:clamp(28px,3vw,42px);font-weight:800}
.lock h2::after{content:"";display:block;width:110px;height:5px;background:var(--yellow);border-radius:3px;margin-top:12px}
label.lbl{display:block;font-weight:800;font-size:18px;margin-bottom:10px;color:var(--ink)}
.inp{width:100%;border:2px solid #C9CFDD;border-radius:14px;padding:16px 18px;font-size:20px;background:#fff;color:var(--ink);outline:none;transition:border .15s}
.inp:focus{border-color:var(--blue)}
.login .btn{width:100%;margin-top:24px;font-size:clamp(22px,2.6vw,34px);padding:16px}
.hint{text-align:center;color:var(--muted);margin-top:14px;font-size:16px}
.err{color:var(--err);font-weight:700;margin-top:12px;min-height:1.4em}
.hero{border-radius:28px;overflow:hidden;box-shadow:var(--shadow);min-height:320px}
.hero img{width:100%;height:100%;object-fit:cover}

/* головна */
.tiles{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.tile{grid-column:span 3;position:relative;overflow:hidden;background:#fff;border:1px solid #E9ECF4;border-radius:var(--r);box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;padding:18px 18px 18px 14px;min-height:170px;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s}
.tiles .tile.w4{grid-column:span 4}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(14,28,110,.13)}
.tile img{width:34%;max-width:180px;height:auto;flex:none;position:relative;z-index:1}
.tile span{position:relative;z-index:1;font-family:var(--disp);font-weight:800;color:var(--navy);font-size:clamp(17px,1.5vw,24px);line-height:1.15;min-width:0}
.tile span::after{content:"";display:block;width:70px;height:4px;background:var(--yellow);border-radius:3px;margin-top:12px}
.tile::after{content:"";position:absolute;right:-40px;bottom:-60px;width:150px;height:110px;border-radius:60% 0 0 0;background:var(--c,var(--teal));transform:rotate(-18deg);opacity:.95}
.banners{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-top:18px}
.banner{position:relative;overflow:hidden;border-radius:var(--r);padding:26px 28px;display:flex;align-items:center;gap:16px;min-height:180px;box-shadow:var(--shadow)}
.banner.sky{background:#E3F5FE}
.banner.cream{background:#FEF8E8}
.banner .tx{position:relative;z-index:1;flex:1;border-left:5px solid var(--yellow);padding-left:16px}
.banner h3{font-size:clamp(24px,2.6vw,36px);font-weight:800}
.banner p{margin:6px 0 16px;font-size:18px}
.banner img{position:relative;z-index:1;mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(ellipse at center,#000 58%,transparent 72%);mask-image:radial-gradient(ellipse at center,#000 58%,transparent 72%);width:min(44%,300px);height:auto}
.banner::after{content:"";position:absolute;right:-30px;bottom:-70px;width:340px;height:120px;border-radius:50%;background:var(--yellow);transform:rotate(-12deg)}
.banner.sky::before{content:"";position:absolute;right:20px;bottom:-60px;width:420px;height:110px;border-radius:50%;background:var(--blue);transform:rotate(-14deg)}
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.valid{background:var(--sky);border-radius:999px;padding:8px 18px;font-weight:700;color:var(--navy);font-size:15px;margin-bottom:26px}

/* рецепт */
.rgrid{display:grid;grid-template-columns:1.12fr 1fr;gap:24px;align-items:start}
.rimg{border-radius:16px;overflow:hidden;background:var(--soft);display:grid;place-items:center;min-height:160px}
.rimg img{width:100%;height:auto;max-height:75vh;object-fit:contain;cursor:zoom-in}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;font-weight:700;font-size:16px;color:var(--ink)}
.chip svg{width:22px;height:22px}
.chip.c1{background:#E3EFFD}.chip.c1 svg{color:var(--blue)}
.chip.c2{background:#E2F6EE}.chip.c2 svg{color:#22A05E}
.chip.c3{background:#FFF3D3}.chip.c3 svg{color:#E3A500}
.chip.c4{background:#FDE8E4}.chip.c4 svg{color:var(--coral)}
.prompt{background:var(--sky);border-radius:16px;padding:22px 24px;font-family:var(--disp);font-weight:700;font-size:clamp(17px,1.7vw,22px);line-height:1.45;color:var(--ink);white-space:pre-wrap;word-break:break-word;max-height:440px;overflow:auto}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.pbtns .btn{font-size:clamp(16px,1.6vw,21px);padding:14px 12px}
.tip{display:flex;align-items:center;gap:12px;margin-top:18px;font-style:italic;font-size:18px}
.tip svg{width:34px;height:34px;color:#E9B400;flex:none}
.steps3{display:flex;align-items:center;justify-content:space-around;gap:10px;background:#D8F3F1;border-radius:16px;padding:16px 20px;margin-top:24px;flex-wrap:wrap}
.steps3 div{display:flex;align-items:center;gap:12px;font-family:var(--disp);font-weight:800;color:var(--navy);font-size:clamp(15px,1.6vw,21px)}
.steps3 i{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-style:normal;flex:none}
.steps3 .bar{width:2px;height:30px;background:#9ADAD6}

/* списки */
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:12px;margin-bottom:22px}
.sel{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff;color:var(--ink);font-weight:600}
.sel:focus{border-color:var(--blue);outline:none}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.rc{background:#fff;border:1px solid #E9ECF4;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s}
.rc:hover{transform:translateY(-3px)}
.rc .th{aspect-ratio:16/9;background:var(--soft);overflow:hidden}
.rc .th img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,var(--sky),#fff 60%,var(--cream));font-family:var(--disp);font-weight:800;color:var(--navy);font-size:20px;text-align:center;padding:10px}
.ph.alt{background:linear-gradient(135deg,var(--mint),#fff 55%,#FDE8E4)}
.rc .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.rc h3{font-size:19px;font-weight:800}
.rc p{margin:0;color:var(--muted);font-size:15px}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.mini span{background:var(--soft);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.load{display:flex;justify-content:center;padding:50px}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--sky2);border-top-color:var(--blue);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* уроки */
.simg{display:block;max-width:100%;max-height:460px;width:auto;margin:12px 0 4px;border-radius:14px;box-shadow:0 6px 16px rgba(14,28,110,.12);cursor:zoom-in}
.sprompt{margin:12px 0 4px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sprompt .prompt{width:100%;font-size:16px;max-height:320px}
.lsteps{display:flex;flex-direction:column;gap:14px;counter-reset:s}
.lstep{display:flex;gap:16px;background:#fff;border:1px solid #E9ECF4;border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.lstep::before{counter-increment:s;content:counter(s);width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-weight:800;flex:none;font-size:19px}
.lstep h3{font-size:19px;margin-bottom:4px}
.lstep p{margin:0;color:var(--ink)}
.lstep label{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:700;color:var(--muted);cursor:pointer;font-size:15px}
.lstep input{width:20px;height:20px;accent-color:var(--teal)}

/* тренажерна */
.tr{position:relative;overflow:hidden}
.tr .bd{gap:10px}
.score{display:inline-block;background:var(--mint);color:#0B7A57;font-weight:800;border-radius:999px;padding:3px 12px;font-size:14px}
.game{max-width:860px;margin:0 auto}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.prog{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;flex:1;min-width:140px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:999px;transition:width .3s}
.q{font-family:var(--disp);font-weight:800;color:var(--navy);font-size:clamp(19px,2vw,25px);margin-bottom:16px}
.qbox{background:var(--sky);border-radius:14px;padding:16px 18px;font-weight:700;margin-bottom:16px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;cursor:pointer;font-weight:700;color:var(--ink);transition:border .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--blue);background:#F5F9FF}
.opt.ok{border-color:var(--ok);background:#E6F7F0}
.opt.no{border-color:var(--err);background:#FDECEA}
.opt[disabled]{cursor:default}
.expl{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--cream);border-left:5px solid var(--yellow)}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.slot{min-height:54px;border:2px dashed #BFC7DA;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;color:var(--muted)}
.slot b{font-family:var(--disp);color:var(--navy);min-width:110px;font-size:15px}
.slot.fill{border-style:solid;border-color:var(--blue);background:#F5F9FF;color:var(--ink);cursor:pointer;font-weight:700}
.slot.ok{border-color:var(--ok);background:#E6F7F0}
.slot.no{border-color:var(--err);background:#FDECEA}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.piece{border:2px solid var(--teal);background:#E8FAF9;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;text-align:left;color:var(--ink)}
.piece:hover{background:#D3F4F2}
.res{text-align:center;padding:20px 0}
.res .big{font-family:var(--disp);font-weight:800;font-size:64px;color:var(--blue)}

/* скринька, дошка */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 20px;font-weight:800;font-family:var(--disp);color:var(--navy);cursor:pointer;font-size:15px}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.form{display:flex;flex-direction:column;gap:16px;max-width:760px}
.ta{width:100%;min-height:130px;border:2px solid var(--line);border-radius:14px;padding:14px 16px;resize:vertical;color:var(--ink);outline:none}
.ta:focus,.fi:focus{border-color:var(--blue)}
.fi{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 16px;outline:none;color:var(--ink)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.types label{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:flex-start;background:#fff}
.types input{accent-color:var(--blue);margin-top:4px}
.types label:has(input:checked){border-color:var(--blue);background:#F5F9FF}
.drop{border:2px dashed #BFC7DA;border-radius:14px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--soft)}
.drop img{max-height:220px;margin:0 auto 8px;border-radius:10px}
.note{background:var(--cream);border-radius:14px;padding:12px 16px;font-size:15px;border-left:5px solid var(--yellow)}
.qa{display:flex;flex-direction:column;gap:14px}
.qi{background:#fff;border:1px solid #E9ECF4;border-radius:18px;box-shadow:var(--shadow);padding:18px 20px}
.qi .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:8px}
.badge{border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px}
.b-wait{background:#FFF3D3;color:#946B00}.b-ok{background:#E2F6EE;color:#0B7A57}.b-type{background:#E3EFFD;color:var(--blue)}
.qi .qt{font-weight:700;white-space:pre-wrap}
.qi .ans{margin-top:12px;background:var(--sky);border-radius:14px;padding:14px 16px;white-space:pre-wrap}
.qi .ans b{display:block;font-family:var(--disp);color:var(--navy);margin-bottom:4px}
.qi img{max-height:320px;max-width:100%;border-radius:10px;margin-top:10px;cursor:zoom-in}
.chal{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:linear-gradient(110deg,#DCEBFF 0%,#EEF6FF 55%,#E3F0FF 100%);border-radius:26px;padding:18px 28px 18px 18px;margin-bottom:24px;box-shadow:0 10px 28px rgba(14,28,110,.10)}
.chal img{width:170px;filter:drop-shadow(0 8px 10px rgba(14,28,110,.15))}
.chal .tx{position:relative;z-index:1}
.chal h2{font-size:clamp(22px,2.6vw,32px)}
.chal p{margin:6px 0 14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.gi{background:#fff;border:1px solid #E9ECF4;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.gi .th{aspect-ratio:4/3;background:var(--soft);cursor:zoom-in}
.gi .th{background:#F3F6FB}
.gi .th img{width:100%;height:100%;object-fit:contain}
.gi .bd{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.gi h3{font-size:17px}
.gi p{margin:0;font-size:14px;color:var(--muted)}
.gi .ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;font-size:14px;font-weight:700;color:var(--navy)}
.like{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:800;color:var(--coral);display:inline-flex;gap:6px;align-items:center}
.like.on{background:#FDE8E4;border-color:var(--coral)}
.like svg{width:18px;height:18px}
.adminbar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:2px dashed var(--blue);background:#F5F9FF;border-radius:18px;padding:14px 20px;margin:-8px 0 18px;cursor:pointer;font-family:var(--disp);font-weight:800;color:var(--navy);font-size:17px;text-align:left}
.adminbar span{color:var(--blue);font-size:15px}
.editpick{background:var(--sky);border-radius:16px;padding:14px 16px}
.ocards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ocard{border:0;background:#fff;border-radius:18px;box-shadow:0 8px 22px rgba(14,28,110,.09);padding:18px 12px;text-align:center;cursor:pointer;font:inherit}
.ocard b{display:block;font-family:var(--disp);font-size:34px;color:var(--blue);font-variant-numeric:tabular-nums}
.ocard span{font-weight:700;color:var(--muted);font-size:15px}
.ocard.warn{background:#FFF6D6}.ocard.warn b{color:#B07A00}
.mtable{overflow-x:auto;border-radius:16px;box-shadow:0 8px 22px rgba(14,28,110,.09)}
.mtable table{width:100%;border-collapse:collapse;background:#fff;min-width:560px}
.mtable th,.mtable td{white-space:nowrap;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:15px}
.mtable th{font-family:var(--disp);color:var(--navy);background:var(--sky)}
.mtable code{font-size:14px;color:var(--navy)}
.rlist{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 6px 18px rgba(14,28,110,.08)}
.rrow.top{background:linear-gradient(100deg,#FFF6D6,#fff 60%)}
.rrow.me{outline:3px solid var(--sky2)}
.rplace{width:40px;text-align:center;font-family:var(--disp);font-weight:800;font-size:22px;color:var(--navy);flex:none}
.rname{flex:1;min-width:0;font-weight:800;color:var(--ink)}
.rpts{font-family:var(--disp);font-weight:800;font-size:22px;color:var(--blue);font-variant-numeric:tabular-nums}
.ocard[data-go]{cursor:pointer}
.wtag{display:inline-block;background:#E3EFFD;color:var(--blue);font-weight:800;font-size:12px;border-radius:999px;padding:2px 9px;align-self:flex-start}
.win-tag{background:linear-gradient(180deg,#FFD84A,#F5B800);color:var(--navy);font-weight:800;font-size:12px;border-radius:999px;padding:3px 10px;align-self:flex-start}
.wkind{display:flex;flex-direction:column;gap:8px}
.wkind label{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;font-weight:600}
.wkind label:has(input:checked){border-color:var(--blue);background:#F5F9FF}
.wkind input{margin-top:5px;accent-color:var(--blue)}
.wkind small{color:var(--muted);font-weight:600}
.hid-tag{background:#EEE;color:#555;font-weight:800;font-size:12px;border-radius:999px;padding:2px 9px;align-self:flex-start}
.btn.del{color:var(--err);border-color:var(--err)}
.btn.del:hover{background:#FDECEA}
.pstrip{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:24px;margin-top:18px;background:linear-gradient(105deg,#FFF6DA 0%,#FFFDF6 55%,#EAF4FF 100%);border-radius:var(--r);padding:22px 26px;box-shadow:var(--shadow);cursor:pointer}
.pstrip .tx{border-left:5px solid var(--yellow);padding-left:16px;min-width:0}
.pstrip h3{font-size:clamp(24px,2.6vw,36px);font-weight:800}
.pstrip p{margin:6px 0 14px;font-size:17px}
.pstrip img{width:min(260px,30vw);height:auto;border-radius:16px;box-shadow:0 12px 26px rgba(14,28,110,.18);transform:rotate(2deg)}
.pj-eye{font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#B7801A}
.pj-th{background:#0E1C3E}
.pj-th img{object-fit:contain!important}
.pj-cover{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);gap:30px;align-items:center;margin:10px 0 26px}
.pj-cover img{width:100%;height:auto;border-radius:20px;box-shadow:0 16px 36px rgba(14,28,110,.18);cursor:zoom-in}
.pj-cover h1{font-size:clamp(34px,5vw,58px);margin:8px 0 10px}
.pj-lead{font-size:18px;color:var(--muted);margin:0 0 14px}
.pj-auth{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:6px}
.pj-auth li{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.pj-auth b{color:var(--navy)}
.pj-auth span{color:var(--muted);font-size:15px}
.pj-intro{background:var(--cream);border-radius:18px;padding:18px 22px;display:grid;gap:8px;margin-bottom:10px}
.pj-toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.pj-toc button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:var(--sky);border-radius:14px;padding:10px 12px;font:inherit;font-weight:700;color:var(--navy);cursor:pointer;line-height:1.25}
.pj-toc b,.pj-num{background:radial-gradient(circle at 35% 30%,#FFE07A,#E0A21C);color:var(--navy);font-family:var(--disp)}
.pj-toc b{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.pj-part{margin-top:46px;scroll-margin-top:90px}
.pj-part>header{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.pj-num{flex:none;width:76px;height:76px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 18px rgba(224,162,28,.35)}
.pj-num span{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;line-height:1}
.pj-num b{font-size:32px;line-height:1}
.pj-part h2{font-size:clamp(24px,3.4vw,34px)}
.pj-by{margin:4px 0 0;color:var(--muted)}
.pj-by b{color:var(--blue)}
.pj-gal{display:grid;gap:12px;margin-bottom:18px}
.pj-gal.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pj-gal.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pj-gal img{width:100%;height:auto;border-radius:14px;cursor:zoom-in;box-shadow:0 8px 20px rgba(14,28,110,.10)}
.pj-body{display:grid;gap:10px;max-width:760px;font-size:17px}
.pj-body p{margin:0}
.pj-body h3{font-size:21px;margin-top:10px}
.pj-body h3.found{color:#B7801A}
.pj-body blockquote{margin:0;padding:12px 18px;border-radius:14px;background:var(--sky);font-style:italic}
.pj-list{margin:0;padding-left:1.5em;display:grid;gap:5px}
.pj-list li::marker{font-weight:800;color:var(--blue)}
.pj-pass{border:2px dashed #E0A21C;border-radius:14px;padding:10px 16px;background:#fff}
.pj-pass span{display:block;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#B7801A}
.pj-pass p{margin:2px 0 0}
.pj-ans{margin-top:50px}
.pj-ans summary{cursor:pointer;font-family:var(--disp);font-weight:800;color:var(--navy);font-size:24px;padding:14px 18px;background:var(--cream);border-radius:16px}
.pj-ans .mtable{margin-top:12px}
.pj-ans td.wrap{white-space:normal;min-width:260px}
.p-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.p-im{position:relative}
.p-im img{width:96px;height:72px;object-fit:cover;border-radius:10px;display:block}

.hello h1{font-size:clamp(34px,5vw,62px);font-style:italic;font-weight:800;display:inline-block;position:relative;padding:4px 34px}
.hello h1 span{position:relative;z-index:1}
.hello h1::before{content:"";position:absolute;inset:8% -2% 0 -2%;background:var(--brush) no-repeat center/100% 100%}
.hello h1::after{content:"";position:absolute;inset:-6px -46px;z-index:0;
  background:linear-gradient(var(--yellow),var(--yellow)) left 18px top 30%/22px 4px no-repeat,linear-gradient(var(--yellow),var(--yellow)) right 18px top 30%/22px 4px no-repeat;opacity:.9}
.hello p{margin:6px 0 0;font-size:18px;color:var(--muted)}
.hello p b{color:var(--navy)}
.tile{border:0;border-radius:24px;box-shadow:0 10px 28px rgba(14,28,110,.10),0 2px 6px rgba(14,28,110,.05);padding:0 18px 0 0;gap:6px;min-height:190px;background:linear-gradient(180deg,#fff,#FAFCFF)}
.tile::after{display:none}
.tile img{width:45%;max-width:none;align-self:stretch;object-fit:contain;object-position:left bottom;padding:12px 0 8px 10px;filter:drop-shadow(0 8px 10px rgba(14,28,110,.15))}
.tile span{min-width:0;font-size:clamp(17px,1.5vw,26px);font-weight:700;text-align:center;flex:1;line-height:1.05}
.tile span::after{width:96px;height:12px;margin:10px auto 0;background:var(--swY) no-repeat center/contain;border-radius:0}
.tile.u-t span::after{background-image:var(--swT)}
.tile:hover img{transform:translateY(-3px) scale(1.03);transition:transform .25s}
.tiles .tile.w4 img{width:48%}
.banner{border-radius:26px;min-height:200px;padding:16px 28px 16px 16px;gap:10px;box-shadow:0 10px 28px rgba(14,28,110,.10)}
.banner::after,.banner.sky::before{display:none}
.banner.sky{background:linear-gradient(110deg,#DCEBFF 0%,#EEF6FF 55%,#E3F0FF 100%)}
.banner.cream{background:linear-gradient(110deg,#DDF5F1 0%,#EEF9FB 55%,#E2F1FB 100%)}
.banner img{order:-1;width:min(40%,250px);mix-blend-mode:normal;-webkit-mask-image:none;mask-image:none;filter:drop-shadow(0 8px 10px rgba(14,28,110,.15))}
.banner .tx{border-left:0;padding-left:0;text-align:center}
.banner h3{font-size:clamp(28px,3.2vw,46px)}
.banner p{color:var(--ink)}
.btn{font-family:var(--disp);font-weight:700;letter-spacing:.01em}
.btn.pill{border-radius:999px;padding:11px 34px;font-size:20px}
.btn.gold{background:linear-gradient(180deg,#FFD84A,#F5B800);border-color:#EDB300;color:var(--navy);box-shadow:0 6px 14px rgba(245,184,0,.35)}
.btn.gold:hover{background:#F5B800;border-color:#F5B800}
.banner.cream .btn{background:linear-gradient(180deg,#1BB5AE,#0E8E8A);border-color:#0E8E8A;box-shadow:0 6px 14px rgba(14,142,138,.3)}
.adminbar{border:0;background:#fff;box-shadow:0 6px 18px rgba(14,28,110,.08);border-left:6px solid var(--blue)}
.lock img{width:110px;height:auto;flex:none;filter:drop-shadow(0 6px 10px rgba(14,28,110,.15))}
.lock h2::after{height:12px;background:var(--swY) no-repeat left/contain;width:140px;border-radius:0}
.chead .ic{display:none}
.chead h2::after{height:12px;width:110px;background:var(--swY) no-repeat left/contain;border-radius:0}
.chip svg{display:none}
.chip{background:#EEF3FB!important;font-size:15px;padding:6px 16px}
.card{border:0;box-shadow:0 10px 28px rgba(14,28,110,.09)}
.rc,.gi,.qi,.lstep,.day{border:0;box-shadow:0 10px 26px rgba(14,28,110,.09)}
.rc .th img[src*="image/webp"]{object-fit:contain;padding:12px}
.tabs button{font-family:var(--disp);font-size:17px}
.foot{align-items:center}

.foot .ln{display:none}
.foot em.sign{font-style:normal;font-family:var(--disp);font-weight:700;border:2px solid var(--blue);border-radius:999px;padding:6px 18px;margin-left:auto;background:#fff}
@media (max-width:1180px) and (min-width:641px){.tile,.tiles .tile.w4{grid-column:span 6}.tile img,.tiles .tile.w4 img{width:44%}}
@media (max-width:640px){
  .brand img{width:76px}
  .ribbon,.leaf{display:none}
  .tile,.tiles .tile.w4{grid-column:span 6;flex-direction:column;min-height:0;padding:12px 10px 16px;gap:4px}
  .tile img,.tiles .tile.w4 img{width:100%;height:118px;object-position:center bottom;padding:0}
  .tile span{font-size:19px}
  .tiles{gap:12px}
  .hello h1{padding:4px 14px}
  .hello h1::after{display:none}
  .banner{flex-direction:column;align-items:center;padding:18px}
  .banner img{width:62%;align-self:center}
  .banner.cream .shopimg img{width:100%}
  .banner.cream .tx{grid-template-columns:1fr;text-align:center}
  .banner.cream .tx .btn{grid-column:1;grid-row:auto;justify-self:center;margin-top:8px}
  .nav{gap:4px;flex-wrap:nowrap}
  .nav button{padding:6px 11px;font-size:15px;white-space:nowrap}
  .nav .ava{width:40px;height:40px;font-size:17px}
  .badges{grid-template-columns:repeat(2,1fr)}
  .ocards{grid-template-columns:repeat(2,1fr)}
  .btn.pill{font-size:17px;padding:10px 24px}
}
@media (max-width:370px){
  .nav{flex-wrap:wrap;justify-content:flex-start}
  .nav button{padding:5px 9px;font-size:14px}
}

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl = s => esc(s).replace(/\n/g,"<br>");
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }
function loading(){ app.innerHTML='<div class="load"><div class="spin"></div></div>'; }
function fmtDate(d){ if(!d) return ""; const x=new Date(d); return isNaN(x)?String(d):x.toLocaleDateString("uk-UA",{day:"numeric",month:"long",year:"numeric"}); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function deviceId(){ let d=lsGet("cu_device",""); if(!d){ d="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,9); lsSet("cu_device",d);} return d; }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} ta.remove(); return ok; }
}
function plural(n,a,b,c){ const m=n%10, h=n%100; return (m===1&&h!==11)?a:(m>=2&&m<=4&&(h<10||h>=20))?b:c; }
function firstName(n){ return String(n||"").trim().split(/\s+/)[0] || "колего"; }
function vocative(n){
  const f = firstName(n);
  if(/ія$/i.test(f)) return f.slice(0,-1)+"є";
  if(/[ая]$/i.test(f)) return f.slice(0,-1)+(/я$/i.test(f)?"ю":"о");
  return f;
}

/* ---------- зв'язок із таблицею ---------- */
async function api(action, payload={}){
  if(DEMO) return demoApi(action, payload);
  const body = JSON.stringify(Object.assign({action, code:S?S.code:payload.code, device:deviceId()}, payload));
  const r = await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body});
  const j = await r.json();
  if(j && j.error === "auth"){ logout(j.message || "Потрібно увійти знову."); throw new Error("auth"); }
  return j;
}

function viewLogin(){
  $("#nav").classList.add("hidden");
  $("#sub").textContent="Робочий простір спільноти «Педагогічна майстерність»";
  app.innerHTML = `
  <section class="login">
    <div class="card">
      <div class="lock"><img src="${IMG.door}" alt=""><h2>Вхід для педагогів</h2></div>
      <div id="lform">
        <label class="lbl" for="code">Особистий код</label>
        <input class="inp" id="code" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="btn" type="button" id="lbtn">Увійти</button>
        <div class="err" id="lerr"></div>
        <div class="hint">Введіть свій код, щоб відкрити матеріали</div>
        ${DEMO?'<div class="demo">Демо-режим: таблицю ще не під\'єднано. Код для перегляду — <b>DEMO</b></div>':''}
      </div>
    </div>
    <div class="hero"><img src="${IMG.hero}" alt="Робочий стіл учительки з планом уроку, ноутбуком і картками"></div>
  </section>`;
  $("#code").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); doLogin(); } };
  $("#lbtn").onclick = doLogin;
  async function doLogin(){
    const code = $("#code").value.trim();
    if(!code){ $("#lerr").textContent="Введіть код."; return; }
    const b=$("#lbtn"); b.disabled=true; b.textContent="Перевіряю…"; $("#lerr").textContent="";
    try{
      const r = await api("login",{code});
      if(r.ok){ S={code:code.toUpperCase(), name:r.name, validTo:r.validTo, role:r.role||"member"}; lsSet("cu_session",S); go(START_ROUTE==="admin"?"home":START_ROUTE); }
      else $("#lerr").textContent = r.message || "Код не підійшов.";
    }catch(err){ $("#lerr").textContent="Немає зв'язку. Перевірте інтернет і спробуйте ще раз."; }
    b.disabled=false; b.textContent="Увійти";
  }
}

function normData(D){
  if(!D) D={recipes:[],lessons:[],projects:[],challenge:null};
  if(!D.projects) D.projects=[];
  if(D.challenge && D.challenge.until){ const u=new Date(D.challenge.until+"T23:59:59"); if(!isNaN(u) && u<new Date()) D.challenge=null; }
  return D;
}
async function fetchData(){
  const r = await api("data");
  if(!r.ok) return null;
  if(r.name){ S.name=r.name; S.validTo=r.validTo; S.role=r.role||S.role; lsSet("cu_session",S); }
  const D = {recipes:r.recipes||[], lessons:r.lessons||[], projects:r.projects||[], advent:r.advent||[], advShow:r.advShow!==false, challenge:r.challenge||null};
  lsSet("cu_cache_"+S.code, D);
  return D;
}
// Спершу миттєво показуємо збережені дані, а свіжі підтягуємо у фоні
async function ensureData(){
  if(DATA) return DATA;
  const cached = lsGet("cu_cache_"+S.code, null);
  const fresh = fetchData().catch(e=>{ if(e.message==="auth") throw e; return null; });
  if(cached){
    DATA = normData(cached);
    const was = JSON.stringify(cached);
    fresh.then(D=>{
      if(!D || JSON.stringify(D)===was) return;
      DATA = normData(D);
      const r=(ROUTE||"home").split("-")[0];
      if(r!=="admin" && !document.querySelector(".modal") && !document.activeElement.matches("input,textarea,select")){ const y=window.scrollY; render().then(()=>window.scrollTo(0,y)); }
    }).catch(()=>{});
    return DATA;
  }
  try{ DATA = normData(await fresh); }catch(e){ if(e.message==="auth") throw e; DATA = normData(null); }
  return DATA;
}

function finishTrainer(k, pct){
  const p=P(); p.trainers[k]=Math.max(p.trainers[k]||0,pct); saveP(p);
  if(pct>=80) sendProgress("trainer",k,pct);
  const msg = pct>=90?"Блискуче! Ви справжня майстриня промптів.":pct>=70?"Чудовий результат! Ще трохи — і буде максимум.":"Гарний початок. Спробуйте ще раз — найкращий результат зберігається.";
  return `<div class="res"><div class="big">${pct}%</div><p style="font-size:19px;font-weight:700">${msg}</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px"><button class="btn" id="again">Ще раз</button><button class="btn ghost" data-go="trainers">До тренажерної</button></div></div>`;
}
function viewTrainer(k){
  const t = TR[k]; if(!t){ viewTrainers(); return; }
  app.innerHTML = crumbs(["Тренажерна","trainers"],[t.title]) + ptitle(t.title, t.desc) + `<div class="card game" id="g"></div>`;
  const g = $("#g");
  if(k==="builder") return runBuilder(t,g);
  return runQuiz(k,t,g);
}
function runQuiz(k,t,g){
  const qs = shuffle(t.qs); let i=0, ok=0;
  const step = () => {
    if(i>=qs.length){ g.innerHTML=finishTrainer(k, Math.round(ok/qs.length*100)); $("#again").onclick=()=>viewTrainer(k); return; }
    const q = qs[i]; const isPair = Array.isArray(q[0]);
    const opts = isPair ? q[0] : q[1]; const right = isPair ? q[1] : q[2]; const ex = isPair ? q[2] : q[3];
    const order = shuffle(opts.map((o,j)=>j));
    g.innerHTML = `<div class="gtop"><b>Завдання ${i+1} з ${qs.length}</b><div class="prog"><i style="width:${i/qs.length*100}%"></i></div></div>
      ${k==="mistake"?`<div class="q">Що не так у цьому промпті?</div><div class="qbox">${esc(q[0])}</div>`:k==="better"?`<div class="q">Який промпт дасть кращий результат?</div>`:`<div class="q">${esc(q[0])}</div>`}
      <div class="opts">${order.map(j=>`<button class="opt" data-j="${j}">${esc(opts[j])}</button>`).join("")}</div><div id="ex"></div>`;
    g.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j; if(j===right) ok++;
      g.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.j===right) x.classList.add("ok"); });
      if(j!==right) b.classList.add("no");
      $("#ex").innerHTML = `<div class="expl"><b>${j===right?"Правильно!":"Не зовсім."}</b> ${esc(ex)}</div><div style="margin-top:16px;text-align:right"><button class="btn" id="nx">${i+1<qs.length?"Далі":"Результат"}</button></div>`;
      $("#nx").onclick=()=>{ i++; step(); };
    });
  };
  step();
}
function runBuilder(t,g){
  const rounds = shuffle(t.rounds); let r=0, okSum=0, total=0;
  const step = () => {
    if(r>=rounds.length){ g.innerHTML=finishTrainer("builder", Math.round(okSum/total*100)); $("#again").onclick=()=>viewTrainer("builder"); return; }
    const parts = rounds[r]; const placed = Array(parts.length).fill(null); let pool = shuffle(parts.map((_,i)=>i)); let checked=false;
    const draw = () => {
      g.innerHTML = `<div class="gtop"><b>Промпт ${r+1} з ${rounds.length}</b><div class="prog"><i style="width:${r/rounds.length*100}%"></i></div></div>
        <div class="q">Натискайте частини по черзі: Роль → Завдання → Деталі → Обмеження → Формат</div>
        <div class="slots">${t.labels.map((l,i)=>{ const v=placed[i]; const cls = v==null?"":"fill"+(checked?(v===i?" ok":" no"):"");
          return `<div class="slot ${cls}" data-i="${i}"><b>${l}</b>${v==null?"…":esc(parts[v])}</div>`;}).join("")}</div>
        <div class="pool">${pool.map(i=>`<button class="piece" data-p="${i}">${esc(parts[i])}</button>`).join("")}</div>
        <div id="ex"></div>`;
      g.querySelectorAll(".piece").forEach(b=>b.onclick=()=>{ if(checked) return; const i=+b.dataset.p; const s=placed.indexOf(null); placed[s]=i; pool=pool.filter(x=>x!==i); draw(); });
      g.querySelectorAll(".slot.fill").forEach(s=>s.onclick=()=>{ if(checked) return; const i=+s.dataset.i; pool.push(placed[i]); placed[i]=null;
        const rest=placed.filter(x=>x!=null); placed.fill(null); rest.forEach((x,j)=>placed[j]=x); draw(); });
      if(!pool.length && !checked){
        $("#ex").innerHTML = `<div style="margin-top:16px;text-align:right"><button class="btn" id="chk">Перевірити</button></div>`;
        $("#chk").onclick=()=>{ checked=true; const ok=placed.filter((v,i)=>v===i).length; okSum+=ok; total+=parts.length; draw();
          $("#ex").innerHTML = `<div class="expl"><b>${ok===parts.length?"Ідеально!":"Правильно "+ok+" з "+parts.length+"."}</b> Такий порядок допомагає і ШІ, і вам: спершу хто ви, потім що зробити, з якими деталями, обмеженнями і в якому вигляді.</div>
          <div class="qbox" style="margin-top:12px">${esc(parts.join(" "))}</div><div style="text-align:right"><button class="btn" id="nx">${r+1<rounds.length?"Далі":"Результат"}</button></div>`;
          $("#nx").onclick=()=>{ r++; step(); }; };
      }
    };
    draw();
  };
  step();
}

/* стискання фото перед відправленням */
function pickImage(drop, input, cb){
  drop.onclick = () => input.click();
  input.onchange = () => {
    const f = input.files[0]; if(!f) return;
    if(!f.type.startsWith("image/")){ toast("Оберіть зображення"); return; }
    const img = new Image(); const url = URL.createObjectURL(f);
    img.onload = () => {
      const max=1400, k=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      const d=c.toDataURL("image/jpeg",0.82); URL.revokeObjectURL(url); cb(d);
      drop.innerHTML = `<img src="${d}" alt="Обране зображення">Натисніть, щоб замінити`;
    };
    img.onerror = () => toast("Не вдалося відкрити зображення");
    img.src = url;
  };
}

async function makeCert(name, place, ym){
  try{ await document.fonts.ready; }catch(e){}
  const W=2480,H=1754,c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
  const load=src=>new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; });
  const [orn,logo,cup]=await Promise.all([load(CERT_IMG.orn),load(CERT_IMG.logo),load(IMG.target)]);
  x.fillStyle="#fff"; x.fillRect(0,0,W,H);
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,"#EAF3FF"); g.addColorStop(1,"#FFF8E0"); x.fillStyle=g; x.fillRect(60,60,W-120,H-120);
  x.lineWidth=10; x.strokeStyle="#0B3CB8"; x.strokeRect(60,60,W-120,H-120); x.lineWidth=4; x.strokeStyle="#F8C315"; x.strokeRect(90,90,W-180,H-180);
  if(orn){ const h=70,w=orn.width*h/orn.height; for(let px=110;px<W-110;px+=w){ x.drawImage(orn,px,120,w,h); x.drawImage(orn,px,H-190,w,h);} }
  if(logo) x.drawImage(logo,170,240,300,300*logo.height/logo.width);
  if(cup) x.drawImage(cup,W-560,230,380,380*cup.height/cup.width);
  const F='"Fira Sans Condensed","Arial Narrow",Arial,sans-serif'; x.textAlign="center";

function pmark(t){
  const out=[]; let ul=[];
  const flush=()=>{ if(ul.length){ out.push('<ol class="pj-list">'+ul.map(x=>`<li>${esc(x)}</li>`).join("")+'</ol>'); ul=[]; } };
  String(t||"").split("\n").forEach(raw=>{
    const l=raw.trim(); if(!l){ flush(); return; }
    if(/^- /.test(l)){ ul.push(l.slice(2)); return; }
    flush();
    if(/^## /.test(l)){ const h=l.slice(3); out.push(`<h3 class="${/знайдено|відкрито/i.test(h)?"found":""}">${esc(h)}</h3>`); }
    else if(/^> /.test(l)) out.push(`<blockquote>${esc(l.slice(2))}</blockquote>`);
    else if(/^! /.test(l)) out.push(`<div class="pj-pass"><span>Секретний пароль</span><p>${esc(l.slice(2))}</p></div>`);
    else out.push(`<p>${esc(l)}</p>`);
  });
  flush(); return out.join("");
}

      ${st[3]?'<label class="chk" style="margin-top:6px;font-size:14px"><input type="checkbox" class="s-del"> Прибрати скриншот</label>':""}</div>`;

function aChallenge(box){
  const ch=DATA.challenge;
  box.innerHTML = `${ch?`<div class="note" style="margin-bottom:18px;max-width:760px">Зараз триває: <b>${esc(ch.desc)}</b>${ch.until?` · до ${esc(fmtDate(ch.until))}`:""}${ch.needLink?" · посилання обовʼязкове":""}</div>`:""}
  <div class="form">
    ${fld("ac_title","Заголовок",'<input class="fi" id="ac_title" maxlength="60" value="Челендж тижня">')}
    ${fld("ac_desc","Завдання челенджу *",'<input class="fi" id="ac_desc" maxlength="140" placeholder="Наприклад: розмальовка до вашої наступної теми">')}
    ${fld("ac_until","До якої дати",'<input class="fi" id="ac_until" type="date">')}
    <label class="chk"><input type="checkbox" id="ac_link" checked> Учасниці обовʼязково додають посилання на роботу (презентацію, гру тощо)</label>
    <div class="note">Новий челендж замінить поточний на головній і на Дошці досягнень.</div>
    <div><button class="btn" type="button" id="ac_send">Запустити челендж</button></div>
  </div>`;
  const d=new Date(); d.setDate(d.getDate()+7); $("#ac_until").value=d.toISOString().slice(0,10);
  $("#ac_send").onclick = () => {
    const v=id=>$("#"+id).value.trim(); const challenge={title:v("ac_title")||"Челендж тижня",desc:v("ac_desc"),until:v("ac_until"),needLink:$("#ac_link").checked};
    if(!challenge.desc){ toast("Опишіть завдання челенджу"); return; }

}
async function aQuestions(box){
  box.innerHTML='<div class="load"><div class="spin"></div></div>';
  try{
    const r=await api("adminQuestions"); const items=(r.items||[]).sort((a,b)=>(!!a.answer)-(!!b.answer));
    const wait=items.filter(q=>!q.answer).length;
    box.innerHTML = items.length ? `<p style="margin:0 0 14px;font-weight:700;color:var(--navy)">Без відповіді: ${wait}</p><div class="qa">${items.map((q,i)=>`<div class="qi" data-row="${esc(q.row)}">
      <div class="meta"><span class="badge b-type">${esc(q.type)}</span><span class="badge ${q.answer?"b-ok":"b-wait"}">${q.answer?"Відповідь є":"Чекає"}</span><span>${esc(q.name)} · ${esc(fmtDate(q.date))}</span></div>
      <div class="qt">${esc(q.text)}</div>
      ${q.prompt?`<div class="qbox" style="margin:10px 0 0;font-weight:600">${esc(q.prompt)}</div>`:""}
      ${q.photo?`<img src="${esc(q.photo)}" alt="Фото до запитання">`:""}
      <label class="lbl" for="qa_${i}" style="margin-top:12px;font-size:15px">Ваша відповідь</label>
      <textarea class="ta" id="qa_${i}" style="min-height:90px" maxlength="20000">${esc(q.answer)}</textarea>
      <div class="arow"><label class="chk"><input type="checkbox" ${q.public?"checked":""}> Показати всім учасницям</label><button class="btn sm" type="button">Зберегти</button></div>
    </div>`).join("")}</div>` : '<div class="empty">Запитань поки немає.</div>';
    box.querySelectorAll(".qi").forEach(c=>{ const b=c.querySelector(".btn"); b.onclick=async()=>{
      const answer=c.querySelector("textarea").value.trim(); if(!answer){ toast("Напишіть відповідь"); return; }
      const ok = await adminSend(b,"adminAnswer",{row:c.dataset.row,answer,public:c.querySelector(".chk input").checked},"Відповідь збережено");
      if(ok){ b.disabled=false; b.textContent="Зберегти"; const s=c.querySelector(".meta .badge:nth-child(2)"); s.className="badge b-ok"; s.textContent="Відповідь є"; }
    }; });
  }catch(err){ if(err.message!=="auth") box.innerHTML='<div class="empty">Не вдалося завантажити. Перевірте інтернет.</div>'; }
}
let WSTATUS="new";
async function aWorks(box){
  box.innerHTML='<div class="load"><div class="spin"></div></div>';
  try{
    const r=await api("adminWorks",{status:WSTATUS}); const items=r.items||[], c=r.counts||{};
    const TABS=[["new","На перевірці"],["ok","На дошці"],["off","Не на дошці"],["all","Усі"]];
    const TAG={new:'<span class="wst w-new">На перевірці</span>',ok:'<span class="wst w-ok">На дошці</span>',hid:'<span class="wst w-hid">Схвалена, не на дошці</span>',no:'<span class="wst w-no">Відхилена</span>'};
    const acts=w=>w.status==="new"?`<label class="wshow"><input type="checkbox" checked> Показати на дошці всім</label><div class="arow"><button class="btn sm" type="button" data-st="approve">✓ Схвалити</button><button class="btn ghost sm" type="button" data-st="reject">Відхилити</button></div>`
      : w.status==="ok"?`<div class="arow"><button class="btn ghost sm" type="button" data-st="hide">🙈 Прибрати з дошки</button><button class="btn ghost sm del" type="button" data-del="1">🗑 Видалити</button></div>`
      : w.status==="hid"?`<div class="arow"><button class="btn sm" type="button" data-st="show">👁 Показати на дошці</button><button class="btn ghost sm del" type="button" data-del="1">🗑 Видалити</button></div>`
      : `<div class="arow"><button class="btn sm" type="button" data-st="show">✓ Схвалити й показати</button><button class="btn ghost sm del" type="button" data-del="1">🗑 Видалити</button></div>`;
    const MSG={new:"Нових робіт на перевірці немає.",ok:"На дошці поки немає робіт.",off:"Тут з'являться схвалені роботи, які ви не показали на дошці, і відхилені.",all:"Робіт поки немає."};
    box.innerHTML = `<div class="tabs wtabs">${TABS.map(([k,t])=>`<button type="button" class="${WSTATUS===k?"on":""}" data-ws="${k}">${t}${c[k]!=null?` · ${c[k]}`:""}</button>`).join("")}</div>
      ${items.length?`<div class="gal">${items.map(w=>`<div class="gi" data-id="${esc(w.id)}">
      <div class="th" data-zoom="${esc(w.photo)}">${w.photo?`<img src="${esc(w.photo)}" alt="${esc(w.title)}" loading="lazy">`:'<div class="ph">Робота</div>'}</div>
      <div class="bd">${TAG[w.status]||""}${w.winner?'<span class="win-tag">🏆 Переможниця</span>':""}${w.challenge?'<span class="ch-tag">Челендж · +15</span>':""}${w.lesson?`<span class="wtag">Урок: ${esc(w.lesson)} · +10</span>`:""}<h3>${esc(w.title)}</h3><p>${esc(w.desc)}</p>${w.link?`<a class="btn sm wlink" href="${esc(w.link)}" target="_blank" rel="noopener">🔗 Відкрити роботу</a>`:""}<p><b>${esc(w.name)}</b> · ${esc(fmtDate(w.date))}</p>
      <div class="wcom"><label class="lbl" for="wc_${esc(w.id)}">💬 Коментар для учасниці</label><textarea class="ta wc" id="wc_${esc(w.id)}" maxlength="1000" placeholder="Що вдалося, що можна покращити… Побачить лише авторка роботи">${esc(w.comment||"")}</textarea>
        ${w.status!=="new"?`<button class="btn ghost sm" type="button" data-cm="1">Зберегти коментар</button>`:'<small class="wc-hint">Коментар збережеться разом зі схваленням чи відхиленням</small>'}</div>
      ${acts(w)}</div></div>`).join("")}</div>`:`<div class="empty">${MSG[WSTATUS]}</div>`}`;
    box.querySelectorAll("[data-ws]").forEach(b=>b.onclick=()=>{ WSTATUS=b.dataset.ws; aWorks(box); });
    box.querySelectorAll("[data-zoom]").forEach(t=>t.onclick=()=>{ if(t.dataset.zoom) modal(`<img class="zoom" src="${esc(t.dataset.zoom)}" alt="">`, true); });
    const MSGS={show:"Роботу показано на дошці",hide:"Роботу прибрано з дошки, бали залишилися",reject:"Роботу відхилено"};
    box.querySelectorAll(".gi [data-st]").forEach(b=>b.onclick=async()=>{
      const card=b.closest(".gi"); let state=b.dataset.st;
      if(state==="approve"){ const cb=card.querySelector(".wshow input"); state=cb&&!cb.checked?"hide":"show"; }
      const comment=card.querySelector(".wc")?card.querySelector(".wc").value:undefined;
      const ok=await adminSend(b,"adminApprove",{id:card.dataset.id,state,comment}, state==="hide"&&b.dataset.st==="approve"?"Роботу схвалено, бали нараховано. На дошці її не видно":MSGS[state]);
      if(ok) aWorks(box);
    });
    box.querySelectorAll(".gi [data-cm]").forEach(b=>b.onclick=()=>{ const card=b.closest(".gi"); adminSend(b,"adminComment",{id:card.dataset.id,comment:card.querySelector(".wc").value},"Коментар збережено"); });
    box.querySelectorAll(".gi [data-del]").forEach(b=>b.onclick=async()=>{
      if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="Так, видалити назавжди"; return; }
      const ok=await adminSend(b,"adminDeleteWork",{id:b.closest(".gi").dataset.id},"Роботу видалено");
      if(ok) aWorks(box);
    });
  }catch(err){ if(err.message!=="auth") box.innerHTML='<div class="empty">Не вдалося завантажити. Перевірте інтернет.</div>'; }
}
