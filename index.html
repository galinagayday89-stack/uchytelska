<style>
:root{
  color-scheme:light;
  --navy:#0E1C6E; --blue:#0B3CB8; --blue-d:#082c8a; --yellow:#F8C315; --teal:#1EC2C0; --coral:#F57F6C;
  --sky:#E4F3FD; --sky2:#CFEAFB; --cream:#FFF8E8; --mint:#DDF6EC; --ink:#1B2245; --muted:#525B7E; --line:#E2E6F0;
  --bg:#FFFFFF; --soft:#F6F8FC; --ok:#13A07A; --err:#D8443A;
  --r:22px; --shadow:0 6px 24px rgba(14,28,110,.08),0 1px 3px rgba(14,28,110,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
h1,h2,h3,h4{font-family:Montserrat,system-ui,sans-serif;color:var(--navy);margin:0;line-height:1.15}
button,input,select,textarea{font:inherit}
a{color:var(--blue)}
img{max-width:100%;display:block}
.hidden{display:none!important}

/* хвиля праворуч угорі */
.wave{position:fixed;top:0;right:0;width:min(330px,40vw);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:1240px;margin:0 auto;padding-block:0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* шапка */
.top{display:flex;align-items:center;gap:18px;padding:18px 0 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;cursor:pointer;min-width:0}
.brand img{width:76px;height:auto}
.brand .sep{width:2px;align-self:stretch;background:var(--navy);opacity:.8;margin:6px 0}
.brand b{display:block;font-family:Montserrat,system-ui,sans-serif;font-weight:800;color:var(--navy);font-size:clamp(22px,3.2vw,38px);line-height:1.05;letter-spacing:-.01em}
.brand small{display:block;color:var(--navy);font-size:clamp(13px,1.4vw,18px);font-weight:600;margin-top:4px}
.nav{margin-left:auto;display:flex;align-items:center;gap:6px}
.nav button{border:0;background:none;color:var(--navy);font-weight:800;font-family:Montserrat,system-ui,sans-serif;font-size:16px;padding:10px 20px;border-radius:999px;cursor:pointer}
.nav button.on{background:var(--blue);color:#fff}
.nav button:hover:not(.on){background:var(--sky)}
.nav .ava,.ava{width:48px;height:48px;border-radius:50%;background:var(--sky2);display:grid;place-items:center;font-family:Montserrat,system-ui,sans-serif;font-weight:800;color:var(--navy);font-size:20px;border:0;cursor:pointer;position:relative;padding:0!important}
.ava::after{content:"";position:absolute;right:-8px;top:-8px;width:14px;height:14px;background:radial-gradient(circle,var(--yellow) 30%,transparent 32%)}
.menu{position:absolute;right:0;top:56px;background:#fff;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:8px;min-width:210px;z-index:20}
.menu div{padding:8px 12px;color:var(--muted);font-size:14px}
.menu button{width:100%;text-align:left;border-radius:10px!important}

/* заголовки сторінок */
.crumbs{display:flex;align-items:center;gap:8px;color:var(--navy);font-size:16px;margin:6px 0 4px;flex-wrap:wrap}
.crumbs a{color:var(--navy);text-decoration:none;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.crumbs b{font-weight:800}
.ptitle{border-left:6px solid var(--yellow);padding-left:20px;margin:12px 0 26px}
.ptitle h1{font-size:clamp(28px,4.4vw,52px);font-weight:800;letter-spacing:-.01em}
.ptitle p{margin:6px 0 0;font-size:clamp(16px,1.8vw,21px);color:var(--ink)}
main{flex:1}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--blue);background:var(--blue);color:#fff;font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:17px;padding:12px 26px;border-radius:14px;cursor:pointer;text-decoration:none;transition:transform .12s,background .12s}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--navy)}
.btn.ghost:hover{background:var(--sky)}
.btn.pill{border-radius:14px;padding:10px 30px}
.btn.sm{font-size:14px;padding:8px 16px;border-radius:12px}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:22px;height:22px}

/* картки */
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #EEF1F7;padding:26px}
.chead{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.chead .ic{width:56px;height:56px;border-radius:14px;background:var(--sky);display:grid;place-items:center;flex:none}
.chead .ic svg{width:30px;height:30px;color:var(--blue)}
.chead h2{font-size:clamp(22px,2.4vw,30px);font-weight:800}
.chead h2::after{content:"";display:block;width:84px;height:4px;background:var(--yellow);border-radius:3px;margin-top:8px}

/* вхід */
.login{display:grid;grid-template-columns:minmax(300px,600px) 1fr;gap:28px;align-items:stretch;margin:24px 0 30px}
.login .card{display:flex;flex-direction:column;justify-content:center;padding:44px 40px}
.lock{display:flex;align-items:center;gap:24px;margin-bottom:34px}
.lock .ic{width:94px;height:94px;border-radius:22px;background:var(--sky);display:grid;place-items:center;flex:none}
.lock .ic svg{width:52px;height:52px;color:var(--blue)}
.lock h2{font-size:clamp(28px,3vw,42px);font-weight:800}
.lock h2::after{content:"";display:block;width:110px;height:5px;background:var(--yellow);border-radius:3px;margin-top:12px}
label.lbl{display:block;font-weight:800;font-size:18px;margin-bottom:10px;color:var(--ink)}
.inp{width:100%;border:2px solid #C9CFDD;border-radius:14px;padding:16px 18px;font-size:20px;background:#fff;color:var(--ink);outline:none;transition:border .15s}
.inp:focus{border-color:var(--blue)}
.login .btn{width:100%;margin-top:24px;font-size:clamp(22px,2.6vw,34px);padding:16px}
.hint{text-align:center;color:var(--muted);margin-top:14px;font-size:16px}
.err{color:var(--err);font-weight:700;margin-top:12px;min-height:1.4em}
.hero{border-radius:28px;overflow:hidden;box-shadow:var(--shadow);min-height:320px}
.hero img{width:100%;height:100%;object-fit:cover}

/* головна */
.tiles{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.tile{grid-column:span 3;position:relative;overflow:hidden;background:#fff;border:1px solid #E9ECF4;border-radius:var(--r);box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;padding:18px 18px 18px 14px;min-height:170px;cursor:pointer;text-align:left;transition:transform .15s,box-shadow .15s}
.tiles .tile.w4{grid-column:span 4}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(14,28,110,.13)}
.tile img{width:34%;max-width:180px;height:auto;flex:none;position:relative;z-index:1}
.tile span{position:relative;z-index:1;font-family:Montserrat,system-ui,sans-serif;font-weight:800;color:var(--navy);font-size:clamp(17px,1.5vw,24px);line-height:1.15;min-width:0}
.tile span::after{content:"";display:block;width:70px;height:4px;background:var(--yellow);border-radius:3px;margin-top:12px}
.tile::after{content:"";position:absolute;right:-40px;bottom:-60px;width:150px;height:110px;border-radius:60% 0 0 0;background:var(--c,var(--teal));transform:rotate(-18deg);opacity:.95}
.banners{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-top:18px}
.banner{position:relative;overflow:hidden;border-radius:var(--r);padding:26px 28px;display:flex;align-items:center;gap:16px;min-height:180px;box-shadow:var(--shadow)}
.banner.sky{background:#E3F5FE}
.banner.cream{background:#FEF8E8}
.banner .tx{position:relative;z-index:1;flex:1;border-left:5px solid var(--yellow);padding-left:16px}
.banner h3{font-size:clamp(24px,2.6vw,36px);font-weight:800}
.banner p{margin:6px 0 16px;font-size:18px}
.banner img{position:relative;z-index:1;mix-blend-mode:multiply;-webkit-mask-image:radial-gradient(ellipse at center,#000 58%,transparent 72%);mask-image:radial-gradient(ellipse at center,#000 58%,transparent 72%);width:min(44%,300px);height:auto}
.banner::after{content:"";position:absolute;right:-30px;bottom:-70px;width:340px;height:120px;border-radius:50%;background:var(--yellow);transform:rotate(-12deg)}
.banner.sky::before{content:"";position:absolute;right:20px;bottom:-60px;width:420px;height:110px;border-radius:50%;background:var(--blue);transform:rotate(-14deg)}
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.valid{background:var(--sky);border-radius:999px;padding:8px 18px;font-weight:700;color:var(--navy);font-size:15px;margin-bottom:26px}

/* рецепт */
.rgrid{display:grid;grid-template-columns:1.12fr 1fr;gap:24px;align-items:start}
.rimg{border-radius:16px;overflow:hidden;background:var(--soft);aspect-ratio:12/5;display:grid;place-items:center}
.rimg img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;font-weight:700;font-size:16px;color:var(--ink)}
.chip svg{width:22px;height:22px}
.chip.c1{background:#E3EFFD}.chip.c1 svg{color:var(--blue)}
.chip.c2{background:#E2F6EE}.chip.c2 svg{color:#22A05E}
.chip.c3{background:#FFF3D3}.chip.c3 svg{color:#E3A500}
.chip.c4{background:#FDE8E4}.chip.c4 svg{color:var(--coral)}
.prompt{background:var(--sky);border-radius:16px;padding:22px 24px;font-family:Montserrat,system-ui,sans-serif;font-weight:700;font-size:clamp(17px,1.7vw,22px);line-height:1.45;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.pbtns .btn{font-size:clamp(16px,1.6vw,21px);padding:14px 12px}
.tip{display:flex;align-items:center;gap:12px;margin-top:18px;font-style:italic;font-size:18px}
.tip svg{width:34px;height:34px;color:#E9B400;flex:none}
.steps3{display:flex;align-items:center;justify-content:space-around;gap:10px;background:#D8F3F1;border-radius:16px;padding:16px 20px;margin-top:24px;flex-wrap:wrap}
.steps3 div{display:flex;align-items:center;gap:12px;font-family:Montserrat,system-ui,sans-serif;font-weight:800;color:var(--navy);font-size:clamp(15px,1.6vw,21px)}
.steps3 i{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-style:normal;flex:none}
.steps3 .bar{width:2px;height:30px;background:#9ADAD6}

/* списки */
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:12px;margin-bottom:22px}
.sel{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff;color:var(--ink);font-weight:600}
.sel:focus{border-color:var(--blue);outline:none}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.rc{background:#fff;border:1px solid #E9ECF4;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .15s}
.rc:hover{transform:translateY(-3px)}
.rc .th{aspect-ratio:16/9;background:var(--soft);overflow:hidden}
.rc .th img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,var(--sky),#fff 60%,var(--cream));font-family:Montserrat,system-ui,sans-serif;font-weight:800;color:var(--navy);font-size:20px;text-align:center;padding:10px}
.ph.alt{background:linear-gradient(135deg,var(--mint),#fff 55%,#FDE8E4)}
.rc .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.rc h3{font-size:19px;font-weight:800}
.rc p{margin:0;color:var(--muted);font-size:15px}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.mini span{background:var(--soft);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.load{display:flex;justify-content:center;padding:50px}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--sky2);border-top-color:var(--blue);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* уроки */
.lsteps{display:flex;flex-direction:column;gap:14px;counter-reset:s}
.lstep{display:flex;gap:16px;background:#fff;border:1px solid #E9ECF4;border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.lstep::before{counter-increment:s;content:counter(s);width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-family:Montserrat,system-ui,sans-serif;font-weight:800;flex:none;font-size:19px}
.lstep h3{font-size:19px;margin-bottom:4px}
.lstep p{margin:0;color:var(--ink)}
.lstep label{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:700;color:var(--muted);cursor:pointer;font-size:15px}
.lstep input{width:20px;height:20px;accent-color:var(--teal)}

/* тренажерна */
.tr{position:relative;overflow:hidden}
.tr .bd{gap:10px}
.score{display:inline-block;background:var(--mint);color:#0B7A57;font-weight:800;border-radius:999px;padding:3px 12px;font-size:14px}
.game{max-width:860px;margin:0 auto}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.prog{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;flex:1;min-width:140px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:999px;transition:width .3s}
.q{font-family:Montserrat,system-ui,sans-serif;font-weight:800;color:var(--navy);font-size:clamp(19px,2vw,25px);margin-bottom:16px}
.qbox{background:var(--sky);border-radius:14px;padding:16px 18px;font-weight:700;margin-bottom:16px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;cursor:pointer;font-weight:700;color:var(--ink);transition:border .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--blue);background:#F5F9FF}
.opt.ok{border-color:var(--ok);background:#E6F7F0}
.opt.no{border-color:var(--err);background:#FDECEA}
.opt[disabled]{cursor:default}
.expl{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--cream);border-left:5px solid var(--yellow)}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.slot{min-height:54px;border:2px dashed #BFC7DA;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;color:var(--muted)}
.slot b{font-family:Montserrat,system-ui,sans-serif;color:var(--navy);min-width:110px;font-size:15px}
.slot.fill{border-style:solid;border-color:var(--blue);background:#F5F9FF;color:var(--ink);cursor:pointer;font-weight:700}
.slot.ok{border-color:var(--ok);background:#E6F7F0}
.slot.no{border-color:var(--err);background:#FDECEA}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.piece{border:2px solid var(--teal);background:#E8FAF9;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;text-align:left;color:var(--ink)}
.piece:hover{background:#D3F4F2}
.res{text-align:center;padding:20px 0}
.res .big{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:64px;color:var(--blue)}

/* скринька, дошка */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 20px;font-weight:800;font-family:Montserrat,system-ui,sans-serif;color:var(--navy);cursor:pointer;font-size:15px}
.tabs button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.form{display:flex;flex-direction:column;gap:16px;max-width:760px}
.ta{width:100%;min-height:130px;border:2px solid var(--line);border-radius:14px;padding:14px 16px;resize:vertical;color:var(--ink);outline:none}
.ta:focus,.fi:focus{border-color:var(--blue)}
.fi{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 16px;outline:none;color:var(--ink)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.types label{border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:flex-start;background:#fff}
.types input{accent-color:var(--blue);margin-top:4px}
.types label:has(input:checked){border-color:var(--blue);background:#F5F9FF}
.drop{border:2px dashed #BFC7DA;border-radius:14px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;background:var(--soft)}
.drop img{max-height:220px;margin:0 auto 8px;border-radius:10px}
.note{background:var(--cream);border-radius:14px;padding:12px 16px;font-size:15px;border-left:5px solid var(--yellow)}
.qa{display:flex;flex-direction:column;gap:14px}
.qi{background:#fff;border:1px solid #E9ECF4;border-radius:18px;box-shadow:var(--shadow);padding:18px 20px}
.qi .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:8px}
.badge{border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px}
.b-wait{background:#FFF3D3;color:#946B00}.b-ok{background:#E2F6EE;color:#0B7A57}.b-type{background:#E3EFFD;color:var(--blue)}
.qi .qt{font-weight:700;white-space:pre-wrap}
.qi .ans{margin-top:12px;background:var(--sky);border-radius:14px;padding:14px 16px;white-space:pre-wrap}
.qi .ans b{display:block;font-family:Montserrat,system-ui,sans-serif;color:var(--navy);margin-bottom:4px}
.qi img{max-height:200px;border-radius:10px;margin-top:10px}
.chal{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:#E3F5FE;border-radius:var(--r);padding:24px 28px;margin-bottom:24px;position:relative;overflow:hidden}
.chal img{width:150px}
.chal .tx{border-left:5px solid var(--yellow);padding-left:16px;position:relative;z-index:1}
.chal h2{font-size:clamp(22px,2.6vw,32px)}
.chal p{margin:6px 0 14px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.gi{background:#fff;border:1px solid #E9ECF4;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.gi .th{aspect-ratio:4/3;background:var(--soft);cursor:zoom-in}
.gi .th img{width:100%;height:100%;object-fit:cover}
.gi .bd{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.gi h3{font-size:17px}
.gi p{margin:0;font-size:14px;color:var(--muted)}
.gi .ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;font-size:14px;font-weight:700;color:var(--navy)}
.like{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:800;color:var(--coral);display:inline-flex;gap:6px;align-items:center}
.like.on{background:#FDE8E4;border-color:var(--coral)}
.like svg{width:18px;height:18px}
.adminbar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:2px dashed var(--blue);background:#F5F9FF;border-radius:18px;padding:14px 20px;margin:-8px 0 18px;cursor:pointer;font-family:Montserrat,system-ui,sans-serif;font-weight:800;color:var(--navy);font-size:17px;text-align:left}
.adminbar span{color:var(--blue);font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chk{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--blue);flex:none}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
.srows{display:flex;flex-direction:column;gap:12px}
.srow{display:flex;gap:12px;align-items:flex-start}
.srow>b{width:36px;height:36px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none;font-family:Montserrat,system-ui,sans-serif;margin-top:6px}
.srow>div{flex:1;min-width:0}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.ch-tag{background:var(--yellow);color:var(--navy);font-weight:800;font-size:12px;border-radius:999px;padding:2px 9px;align-self:flex-start}

/* журнал */
.jtop{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;margin-bottom:22px}
.jtop .ava{width:80px;height:80px;font-size:34px;cursor:default}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat{background:var(--soft);border-radius:18px;padding:16px;text-align:center}
.stat b{display:block;font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:34px;color:var(--blue)}
.stat span{font-weight:700;color:var(--muted);font-size:15px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:28px}
.bdg{border-radius:18px;padding:16px 12px;text-align:center;border:2px solid var(--line);background:#fff}
.bdg .ico{width:62px;height:62px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:24px;color:#fff}
.bdg b{display:block;font-family:Montserrat,system-ui,sans-serif;color:var(--navy);font-size:15px}
.bdg span{font-size:13px;color:var(--muted)}
.bdg.off{opacity:.45;filter:grayscale(1)}
h2.sec{font-size:24px;margin:8px 0 14px}

/* перший день */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:12px 0 26px}
.day{border-radius:var(--r);padding:20px;background:#fff;border:2px solid var(--line);box-shadow:var(--shadow)}
.day.done{border-color:var(--ok);background:#F1FBF7}
.day h3{font-size:20px;margin-bottom:6px}
.day .dn{font-family:Montserrat,system-ui,sans-serif;font-weight:800;color:var(--coral);font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.day p{margin:0 0 12px}
.how{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.how div{background:var(--soft);border-radius:18px;padding:16px 18px}
.how b{font-family:Montserrat,system-ui,sans-serif;color:var(--navy);display:block;margin-bottom:4px}

/* модальне вікно, сповіщення */
.modal{position:fixed;inset:0;background:rgba(14,28,110,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:min(640px,100%);max-height:92vh;overflow:auto}
.modal .zoom{max-width:min(1000px,96vw);max-height:90vh;border-radius:16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.demo{background:var(--cream);border:1px dashed #E3B400;color:#6b5200;border-radius:12px;padding:8px 14px;font-size:14px;margin:4px 0 0}

/* підвал */

}

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl = s => esc(s).replace(/\n/g,"<br>");
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }
function loading(){ app.innerHTML='<div class="load"><div class="spin"></div></div>'; }
function fmtDate(d){ if(!d) return ""; const x=new Date(d); return isNaN(x)?String(d):x.toLocaleDateString("uk-UA",{day:"numeric",month:"long",year:"numeric"}); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function deviceId(){ let d=lsGet("cu_device",""); if(!d){ d="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,9); lsSet("cu_device",d);} return d; }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} ta.remove(); return ok; }
}
function plural(n,a,b,c){ const m=n%10, h=n%100; return (m===1&&h!==11)?a:(m>=2&&m<=4&&(h<10||h>=20))?b:c; }
function firstName(n){ return String(n||"").trim().split(/\s+/)[0] || "колего"; }
function vocative(n){
  const f = firstName(n);
  if(/ія$/i.test(f)) return f.slice(0,-1)+"є";
  if(/[ая]$/i.test(f)) return f.slice(0,-1)+(/я$/i.test(f)?"ю":"о");
  return f;
}

/* ---------- зв'язок із таблицею ---------- */
async function api(action, payload={}){
  if(DEMO) return demoApi(action, payload);
  const body = JSON.stringify(Object.assign({action, code:S?S.code:payload.code, device:deviceId()}, payload));
  const r = await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body});
  const j = await r.json();
  if(j && j.error === "auth"){ logout(j.message || "Потрібно увійти знову."); throw new Error("auth"); }
  return j;
}

const demoStore = () => lsGet("cu_demo", {questions:[], works:[], likes:{}});
async function demoApi(action, p){
  await new Promise(r=>setTimeout(r,250));
  const st = demoStore();
  switch(action){
    case "login":
      if(["DEMO","ДЕМО"].includes(String(p.code||"").trim().toUpperCase())) return {ok:true, name:"Галина", validTo:"", role:"admin"};
      return {ok:false, message:"Код не знайдено. У демо-режимі введіть DEMO."};
    case "data": return Object.assign({ok:true}, DEMO_DATA, {
      recipes:[...(st.recipes||[]).filter(r=>r.show), ...DEMO_DATA.recipes],
      lessons:[...DEMO_DATA.lessons, ...(st.lessons||[]).filter(l=>l.show)],
      challenge: st.challenge || DEMO_DATA.challenge, role:"admin"});
    case "adminAddRecipe": (st.recipes=st.recipes||[]).unshift(Object.assign({id:"r"+Date.now(), img:p.photo||"", show:p.show}, p.recipe)); lsSet("cu_demo",st); return {ok:true};
    case "adminAddLesson": (st.lessons=st.lessons||[]).push(Object.assign({id:"l"+Date.now(), img:"", show:p.show}, p.lesson)); lsSet("cu_demo",st); return {ok:true};
    case "adminSetChallenge": st.challenge=Object.assign({id:"c"+Date.now()}, p.challenge); lsSet("cu_demo",st); return {ok:true};
    case "adminQuestions": { st.seedQ = st.seedQ || {answer:"",public:false};
      return {ok:true, items:[...st.questions.map((q,i)=>Object.assign({row:"m"+i, name:"Галина (демо)", public:!!q.public}, q)),
        {row:"s0", name:"Олена Петренко", date:"2026-11-04", type:"Потрібен промпт", text:"Як зробити гру-вікторину для 3 класу за допомогою ШІ?", prompt:"", photo:"", answer:st.seedQ.answer, public:st.seedQ.public}]}; }
    case "adminAnswer": if(p.row==="s0") st.seedQ={answer:p.answer,public:p.public}; else { const q=st.questions[+String(p.row).slice(1)]; if(q){ q.answer=p.answer; q.public=p.public; } } lsSet("cu_demo",st); return {ok:true};
    case "adminWorks": { st.seedW = st.seedW || "";
      const own = st.works.filter(w=>!w.approved && !w.rejected);
      return {ok:true, items:[...own, ...(st.seedW?[]:[{id:"s1", name:"Ірина Коваль", date:"2026-11-05", title:"Картки «Зимові птахи»", desc:"Для уроку ЯДС, 2 клас", photo:IMG.recipeDemo, challenge:true}])]}; }
    case "adminApprove": if(p.id==="s1") st.seedW=p.approve?"ok":"no"; else { const w=st.works.find(x=>x.id===p.id); if(w){ if(p.approve) w.approved=true; else w.rejected=true; } } lsSet("cu_demo",st); return {ok:true};
    case "ask": st.questions.unshift({date:new Date().toISOString(), type:p.type, text:p.text, prompt:p.prompt||"", photo:p.photo||"", answer:"", status:"Очікує"}); lsSet("cu_demo",st); return {ok:true};
    case "myQuestions": return {ok:true, items:st.questions};
    case "publicAnswers": return {ok:true, items:[
      {date:"2026-11-03",type:"Потрібен промпт",text:"Як зробити, щоб ШІ писав без помилок українською на картинках?",answer:"Пишіть усі написи в лапках, обмежуйтеся 2–5 словами на зображенні й додавайте: «усі написи українською, без помилок». Довгі тексти краще додавати потім у Canva."},
      {date:"2026-11-01",type:"Питання про платформу",text:"Чим відрізняється Gemini від ChatGPT для картинок?",answer:"Обидва створюють зображення. Пробуйте один промпт в обох і порівнюйте — для різних стилів краще працюють різні сервіси."}]};
    case "submitWork": st.works.unshift({id:"w"+Date.now(), date:new Date().toISOString(), name:"Галина", title:p.title, desc:p.desc, photo:p.photo, challenge:p.challenge, approved:false, likes:0}); lsSet("cu_demo",st); return {ok:true};
    case "gallery": return {ok:true, items:[
      {id:"g1",name:"Олена",title:"Картки «Природа восени»",desc:"Для уроку ЯДС у 2 класі",photo:IMG.recipeDemo,challenge:true,likes:(st.likes.g1||0)+12},
      {id:"g2",name:"Наталія",title:"Мій робочий стіл",desc:"Готуюся до уроку з новими картками",photo:IMG.hero,challenge:false,likes:(st.likes.g2||0)+7},
      ...(st.seedW==="ok"?[{id:"s1",name:"Ірина",title:"Картки «Зимові птахи»",desc:"Для уроку ЯДС, 2 клас",photo:IMG.recipeDemo,challenge:true,likes:st.likes.s1||0}]:[]),
      ...st.works.filter(w=>w.approved).map(w=>Object.assign({},w,{likes:st.likes[w.id]||0}))]};
    case "myWorks": return {ok:true, items:st.works};
    case "like": st.likes[p.id]=(st.likes[p.id]||0)+(p.undo?-1:1); lsSet("cu_demo",st); return {ok:true};
  }
  return {ok:false};
}

async function ensureData(){
  if(DATA) return DATA;
  DATA = lsGet("cu_cache_"+S.code, null);
  try{
    const r = await api("data");
    if(r.ok){ DATA = {recipes:r.recipes||[], lessons:r.lessons||[], challenge:r.challenge||null}; lsSet("cu_cache_"+S.code, DATA); if(r.name){S.name=r.name; S.validTo=r.validTo; S.role=r.role||S.role; lsSet("cu_session",S);} }
  }catch(e){ if(e.message==="auth") throw e; }
  if(!DATA) DATA={recipes:[],lessons:[],challenge:null};
  return DATA;
}

function viewRecipes(){

  const sel = (k,label) => `<select class="sel" data-f="${k}"><option value="">${label}</option>${opts(k).map(o=>`<option ${RF[k]===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;

    ${sel("subject","Усі предмети")}${sel("grade","Усі класи")}${sel("type","Усі типи")}${sel("platform","Усі платформи")}
  </div>
  <div class="grid3" id="rlist"></div>`;
  const draw = () => {
    const q = RF.q.toLowerCase();
    const list = R.filter(r => (!q || [r.title,r.desc,r.prompt,r.subject,r.type].join(" ").toLowerCase().includes(q))
      && ["subject","grade","type","platform"].every(k=>!RF[k]||r[k]===RF[k]));
    $("#rlist").innerHTML = list.length ? list.map(rcard).join("") : `<div class="empty" style="grid-column:1/-1">Нічого не знайдено. Спробуйте інші фільтри.</div>`;
  };
  $("#rq").oninput = e => { RF.q=e.target.value; draw(); };
  app.querySelectorAll("[data-f]").forEach(s=>s.onchange=e=>{ RF[s.dataset.f]=e.target.value; draw(); });
  draw();
}

function finishTrainer(k, pct){
  const p=P(); p.trainers[k]=Math.max(p.trainers[k]||0,pct); saveP(p);
  const msg = pct>=90?"Блискуче! Ви справжня майстриня промптів.":pct>=70?"Чудовий результат! Ще трохи — і буде максимум.":"Гарний початок. Спробуйте ще раз — найкращий результат зберігається.";
  return `<div class="res"><div class="big">${pct}%</div><p style="font-size:19px;font-weight:700">${msg}</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px"><button class="btn" id="again">Ще раз</button><button class="btn ghost" data-go="trainers">До тренажерної</button></div></div>`;
}
function viewTrainer(k){
  const t = TR[k]; if(!t){ viewTrainers(); return; }
  app.innerHTML = crumbs(["Тренажерна","trainers"],[t.title]) + ptitle(t.title, t.desc) + `<div class="card game" id="g"></div>`;
  const g = $("#g");
  if(k==="builder") return runBuilder(t,g);
  return runQuiz(k,t,g);
}
function runQuiz(k,t,g){
  const qs = shuffle(t.qs); let i=0, ok=0;
  const step = () => {
    if(i>=qs.length){ g.innerHTML=finishTrainer(k, Math.round(ok/qs.length*100)); $("#again").onclick=()=>viewTrainer(k); return; }
    const q = qs[i]; const isPair = Array.isArray(q[0]);
    const opts = isPair ? q[0] : q[1]; const right = isPair ? q[1] : q[2]; const ex = isPair ? q[2] : q[3];
    const order = shuffle(opts.map((o,j)=>j));
    g.innerHTML = `<div class="gtop"><b>Завдання ${i+1} з ${qs.length}</b><div class="prog"><i style="width:${i/qs.length*100}%"></i></div></div>
      ${k==="mistake"?`<div class="q">Що не так у цьому промпті?</div><div class="qbox">${esc(q[0])}</div>`:k==="better"?`<div class="q">Який промпт дасть кращий результат?</div>`:`<div class="q">${esc(q[0])}</div>`}
      <div class="opts">${order.map(j=>`<button class="opt" data-j="${j}">${esc(opts[j])}</button>`).join("")}</div><div id="ex"></div>`;
    g.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j; if(j===right) ok++;
      g.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.j===right) x.classList.add("ok"); });
      if(j!==right) b.classList.add("no");
      $("#ex").innerHTML = `<div class="expl"><b>${j===right?"Правильно!":"Не зовсім."}</b> ${esc(ex)}</div><div style="margin-top:16px;text-align:right"><button class="btn" id="nx">${i+1<qs.length?"Далі":"Результат"}</button></div>`;
      $("#nx").onclick=()=>{ i++; step(); };
    });
  };
  step();
}
function runBuilder(t,g){
  const rounds = shuffle(t.rounds); let r=0, okSum=0, total=0;
  const step = () => {
    if(r>=rounds.length){ g.innerHTML=finishTrainer("builder", Math.round(okSum/total*100)); $("#again").onclick=()=>viewTrainer("builder"); return; }
    const parts = rounds[r]; const placed = Array(parts.length).fill(null); let pool = shuffle(parts.map((_,i)=>i)); let checked=false;
    const draw = () => {
      g.innerHTML = `<div class="gtop"><b>Промпт ${r+1} з ${rounds.length}</b><div class="prog"><i style="width:${r/rounds.length*100}%"></i></div></div>
        <div class="q">Натискайте частини по черзі: Роль → Завдання → Деталі → Обмеження → Формат</div>
        <div class="slots">${t.labels.map((l,i)=>{ const v=placed[i]; const cls = v==null?"":"fill"+(checked?(v===i?" ok":" no"):"");
          return `<div class="slot ${cls}" data-i="${i}"><b>${l}</b>${v==null?"…":esc(parts[v])}</div>`;}).join("")}</div>
        <div class="pool">${pool.map(i=>`<button class="piece" data-p="${i}">${esc(parts[i])}</button>`).join("")}</div>
        <div id="ex"></div>`;
      g.querySelectorAll(".piece").forEach(b=>b.onclick=()=>{ if(checked) return; const i=+b.dataset.p; const s=placed.indexOf(null); placed[s]=i; pool=pool.filter(x=>x!==i); draw(); });
      g.querySelectorAll(".slot.fill").forEach(s=>s.onclick=()=>{ if(checked) return; const i=+s.dataset.i; pool.push(placed[i]); placed[i]=null;
        const rest=placed.filter(x=>x!=null); placed.fill(null); rest.forEach((x,j)=>placed[j]=x); draw(); });
      if(!pool.length && !checked){
        $("#ex").innerHTML = `<div style="margin-top:16px;text-align:right"><button class="btn" id="chk">Перевірити</button></div>`;
        $("#chk").onclick=()=>{ checked=true; const ok=placed.filter((v,i)=>v===i).length; okSum+=ok; total+=parts.length; draw();
          $("#ex").innerHTML = `<div class="expl"><b>${ok===parts.length?"Ідеально!":"Правильно "+ok+" з "+parts.length+"."}</b> Такий порядок допомагає і ШІ, і вам: спершу хто ви, потім що зробити, з якими деталями, обмеженнями і в якому вигляді.</div>
          <div class="qbox" style="margin-top:12px">${esc(parts.join(" "))}</div><div style="text-align:right"><button class="btn" id="nx">${r+1<rounds.length?"Далі":"Результат"}</button></div>`;
          $("#nx").onclick=()=>{ r++; step(); }; };
      }
    };
    draw();
  };
  step();
}

/* стискання фото перед відправленням */
function pickImage(drop, input, cb){
  drop.onclick = () => input.click();
  input.onchange = () => {
    const f = input.files[0]; if(!f) return;
    if(!f.type.startsWith("image/")){ toast("Оберіть зображення"); return; }
    const img = new Image(); const url = URL.createObjectURL(f);
    img.onload = () => {
      const max=1400, k=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      const d=c.toDataURL("image/jpeg",0.82); URL.revokeObjectURL(url); cb(d);
      drop.innerHTML = `<img src="${d}" alt="Обране зображення">Натисніть, щоб замінити`;
    };
    img.onerror = () => toast("Не вдалося відкрити зображення");
    img.src = url;
  };
}

    const wait=items.filter(q=>!q.answer).length;
    box.innerHTML = items.length ? `<p style="margin:0 0 14px;font-weight:700;color:var(--navy)">Без відповіді: ${wait}</p><div class="qa">${items.map((q,i)=>`<div class="qi" data-row="${esc(q.row)}">
      <div class="meta"><span class="badge b-type">${esc(q.type)}</span><span class="badge ${q.answer?"b-ok":"b-wait"}">${q.answer?"Відповідь є":"Чекає"}</span><span>${esc(q.name)} · ${esc(fmtDate(q.date))}</span></div>
      <div class="qt">${esc(q.text)}</div>
      ${q.prompt?`<div class="qbox" style="margin:10px 0 0;font-weight:600">${esc(q.prompt)}</div>`:""}
      ${q.photo?`<img src="${esc(q.photo)}" alt="Фото до запитання">`:""}
      <label class="lbl" for="qa_${i}" style="margin-top:12px;font-size:15px">Ваша відповідь</label>
      <textarea class="ta" id="qa_${i}" style="min-height:90px" maxlength="3000">${esc(q.answer)}</textarea>
      <div class="arow"><label class="chk"><input type="checkbox" ${q.public?"checked":""}> Показати всім учасницям</label><button class="btn sm" type="button">Зберегти</button></div>
    </div>`).join("")}</div>` : '<div class="empty">Запитань поки немає.</div>';
    box.querySelectorAll(".qi").forEach(c=>{ const b=c.querySelector(".btn"); b.onclick=async()=>{
      const answer=c.querySelector("textarea").value.trim(); if(!answer){ toast("Напишіть відповідь"); return; }
      const ok = await adminSend(b,"adminAnswer",{row:c.dataset.row,answer,public:c.querySelector(".chk input").checked},"Відповідь збережено");
      if(ok){ b.disabled=false; b.textContent="Зберегти"; const s=c.querySelector(".meta .badge:nth-child(2)"); s.className="badge b-ok"; s.textContent="Відповідь є"; }
    }; });
  }catch(err){ if(err.message!=="auth") box.innerHTML='<div class="empty">Не вдалося завантажити. Перевірте інтернет.</div>'; }
}
async function aWorks(box){
  box.innerHTML='<div class="load"><div class="spin"></div></div>';
  try{
    const r=await api("adminWorks"); const items=r.items||[];
    box.innerHTML = items.length ? `<p style="margin:0 0 14px;font-weight:700;color:var(--navy)">На перевірці: <span id="wcount">${items.length}</span></p><div class="gal">${items.map(w=>`<div class="gi" data-id="${esc(w.id)}">
      <div class="th" data-zoom="${esc(w.photo)}">${w.photo?`<img src="${esc(w.photo)}" alt="${esc(w.title)}" loading="lazy">`:'<div class="ph">Робота</div>'}</div>
      <div class="bd">${w.challenge?'<span class="ch-tag">Челендж</span>':""}<h3>${esc(w.title)}</h3><p>${esc(w.desc)}</p><p><b>${esc(w.name)}</b> · ${esc(fmtDate(w.date))}</p>
      <div class="arow"><button class="btn sm" type="button" data-ok="1">Схвалити</button><button class="btn ghost sm" type="button" data-ok="0">Відхилити</button></div></div></div>`).join("")}</div>`
      : '<div class="empty">Нових робіт на перевірці немає.</div>';
    box.querySelectorAll("[data-zoom]").forEach(t=>t.onclick=()=>{ if(t.dataset.zoom) modal(`<img class="zoom" src="${esc(t.dataset.zoom)}" alt="">`, true); });
    box.querySelectorAll(".gi [data-ok]").forEach(b=>b.onclick=async()=>{
      const c=b.closest(".gi"), yes=b.dataset.ok==="1";
      const ok=await adminSend(b,"adminApprove",{id:c.dataset.id,approve:yes}, yes?"Роботу додано на дошку":"Роботу відхилено");
      if(ok){ c.remove(); const n=$("#wcount"); if(n) n.textContent=+n.textContent-1; }
    });
  }catch(err){ if(err.message!=="auth") box.innerHTML='<div class="empty">Не вдалося завантажити. Перевірте інтернет.</div>'; }
}
